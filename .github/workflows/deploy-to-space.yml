on:
  push:
    branches: [main]
    paths:
      - app.py
      - lawqa_demo.py
      - requirements_space.txt
      - .github/workflows/deploy-to-space.yml
      - .github/scripts/deploy_to_space.py

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      
      - run: pip install huggingface_hub

      - env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python .github/scripts/deploy_to_space.py
